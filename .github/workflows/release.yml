name: Release

# Push a v* tag: tests, VSIX + CLI build, GitHub release with both attached.
# Marketplace publishing runs only when the VSCE_PAT secret is configured.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Check tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run vsix
      - run: npm run verify-package
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.vsix dist/adr-companion-cli.cjs --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.vsix dist/adr-companion-cli.cjs --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
          fi
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT is not set — skipping Marketplace publish."
          else
            npx vsce publish --no-dependencies --packagePath ./*.vsix
          fi
